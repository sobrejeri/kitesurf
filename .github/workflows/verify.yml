name: Vento - build and database rules

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Verify student level is asked only at signup
        run: node scripts/test-auth-kite-level.mjs
      - name: Test Admin booking progress calculations
        run: node --experimental-strip-types scripts/test-booking-progress.mjs
      - name: Diagnose Admin demo multi-meeting schedule conflicts
        run: node --experimental-strip-types scripts/test-admin-demo-schedule.mjs
      - name: Test student multi-booking and history separation
        run: node --experimental-strip-types scripts/test-booking-cycle.mjs
      - name: Verify Vento student desktop layout and booking overlap protection
        run: node scripts/test-student-desktop.mjs
      - name: Test student schedule conflicts and evolution destinations
        run: node --experimental-strip-types scripts/test-student-schedule.mjs
      - name: Test real admin agenda date ranges
        run: node --experimental-strip-types scripts/test-admin-agenda-range.mjs
      - name: Test per-level quote selection and exact money inputs
        run: node --experimental-strip-types scripts/test-level-prices.mjs
      - name: Test floating chat conversations and message order
        run: node --experimental-strip-types scripts/test-chat-dock.mjs
      - name: Test personal home booking selection and progress
        run: node --experimental-strip-types scripts/test-student-home.mjs
      - name: Test student homepage poster and booking CTA
        run: node scripts/test-home-banner.mjs
      - name: Test instructor completed lesson detail selection
        run: node --experimental-strip-types scripts/test-instructor-completed-meetings.mjs
      - name: Test instructor lesson tabs and ordered-start eligibility
        run: node --experimental-strip-types scripts/test-instructor-lesson-tabs.mjs
      - name: Test inline card detail layouts
        run: node scripts/test-inline-detail-layout.mjs
      - name: Check PostgREST relationship ambiguity
        run: node scripts/verify-postgrest-relationships.mjs
      - run: pnpm build
      - name: Install isolated PostgreSQL tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Run isolated database migrations and SQL assertions
        run: bash scripts/test-db.sh
