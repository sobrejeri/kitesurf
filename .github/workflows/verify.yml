name: Vento - build and database rules

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Verify student level is asked only at signup
        run: node scripts/test-auth-kite-level.mjs
      - name: Test Admin booking progress calculations
        run: node --experimental-strip-types scripts/test-booking-progress.mjs
      - name: Diagnose Admin demo multi-meeting schedule conflicts
        run: node --experimental-strip-types scripts/test-admin-demo-schedule.mjs
      - name: Verify opt-in Claude QA reviewer safety and config
        run: node scripts/test-claude-qa-config.mjs
      - name: Verify workspace navigation and responsive status labels
        run: node --experimental-strip-types scripts/test-l0-workspace-controls.mjs
      - name: Verify workspace phone header fits the logo and area label
        run: node scripts/test-workspace-mobile-header-fit.mjs
      - name: Verify accessible shared fields and bounded progress meters
        run: node --experimental-strip-types scripts/test-l0-shared-control-accessibility.mjs
      - name: Verify active navigation states and mobile dialog keyboard focus
        run: node --experimental-strip-types scripts/test-l0-mobile-navigation.mjs
      - name: Verify student swipe recovery and safe private previews
        run: node --experimental-strip-types scripts/test-student-swipe-reliability.mjs
      - name: Verify edge-started scrolling in the installed student PWA
        run: node --experimental-strip-types scripts/test-student-swipe-edge-scroll.mjs
      - name: Test safe student deep-link back navigation
        run: node --experimental-strip-types scripts/test-student-safe-back.mjs
      - name: Verify student subpages clear the floating phone app bar
        run: node scripts/test-student-subpage-header-clearance.mjs
      - name: Test student multi-booking and history separation
        run: node --experimental-strip-types scripts/test-booking-cycle.mjs
      - name: Verify Vento student desktop layout and booking overlap protection
        run: node scripts/test-student-desktop.mjs
      - name: Test student schedule conflicts and evolution destinations
        run: node --experimental-strip-types scripts/test-student-schedule.mjs
      - name: Test real admin agenda date ranges
        run: node --experimental-strip-types scripts/test-admin-agenda-range.mjs
      - name: Test per-level quote selection and exact money inputs
        run: node --experimental-strip-types scripts/test-level-prices.mjs
      - name: Test floating chat conversations and message order
        run: node --experimental-strip-types scripts/test-chat-dock.mjs
      - name: Test personal home booking selection and progress
        run: node --experimental-strip-types scripts/test-student-home.mjs
      - name: Test student homepage poster and booking CTA
        run: node scripts/test-home-banner.mjs
      - name: Test photorealistic VentoKite student visual
        run: node scripts/test-student-visual-photo.mjs
      - name: Test instructor completed lesson detail selection
        run: node --experimental-strip-types scripts/test-instructor-completed-meetings.mjs
      - name: Test instructor lesson tabs and ordered-start eligibility
        run: node --experimental-strip-types scripts/test-instructor-lesson-tabs.mjs
      - name: Test inline card detail layouts
        run: node scripts/test-inline-detail-layout.mjs
      - name: Test VentoKite Protege five-day incident policy
        run: node --experimental-strip-types scripts/test-lesson-protection-policy.mjs
      - name: Test overdue lesson protection monitoring
        run: node --experimental-strip-types scripts/test-protection-monitor.mjs
      - name: Test visible VentoKite Protege incident report summaries
        run: node --experimental-strip-types scripts/test-protection-report-summary.mjs
      - name: Validate gated Stage 3B structured statements rules
        run: node --experimental-strip-types scripts/test-protection-stage3.mjs
      - name: Test historical VentoKite Protege case discovery
        run: node --experimental-strip-types scripts/test-protection-case-history.mjs
      - name: Test dry-run evidence retention safeguards
        run: node --experimental-strip-types scripts/test-protection-evidence-retention.mjs
      - name: Test VentoKite Protege archive search and independent pagination
        run: node --experimental-strip-types scripts/test-protection-archive-pagination.mjs
      - name: Verify admin-only VentoKite Protege QA console never mutates data
        run: node scripts/test-protection-qa-console.mjs
      - name: Check PostgREST relationship ambiguity
        run: node scripts/verify-postgrest-relationships.mjs
      - run: pnpm build
      - name: Install isolated PostgreSQL tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Run isolated database migrations and SQL assertions
        run: bash scripts/test-db.sh
