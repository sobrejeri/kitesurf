name: Multi-agent unit tests
on:
  push:
    branches: [agent/work/multi-agent-orchestrator]
    paths: ['ops/multi-agent/**', '.github/workflows/multi-agent-tests.yml']
  pull_request:
    paths: ['ops/multi-agent/**', '.github/workflows/multi-agent-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ops/multi-agent/*.test.mjs
